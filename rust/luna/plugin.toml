id = "alice-apple-music"
name = "Alice × Apple Music"
version = "0.2.3"
entry = "bin/alice-apple-music"
description = "Apple Music по голосу: песни, очередь, рекомендации и название трека. Нативный плеер для Luna."
permissions = ["exec"]

[launch]
kind = "binary"
mode = "service"
path = "bin/alice-apple-music"
args = ["--luna", "--local-voice", "--private", "../../apple-music-private", "--cache", "/tmp/alice-apple-music-cache"]

[compatibility]
# Some Luna builds use this legacy ID for station-midi firmware.
models = ["yandexmidi", "yandexstation_2"]
features = []
