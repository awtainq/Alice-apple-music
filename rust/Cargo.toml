[package]
name = "alice-apple-music"
version = "0.3.6"
edition = "2021"
license = "GPL-3.0-only"
description = "Standalone Apple Music player for a rooted Station Midi and Luna"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
subtle = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
widevine = "=0.1.0"
zbus = { version = "4", default-features = false, features = ["tokio"] }

[dev-dependencies]
tower = {version="0.5",features=["util"]}

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[workspace]
members = ["xtask", "luna-import"]
default-members = ["."]
resolver = "2"
