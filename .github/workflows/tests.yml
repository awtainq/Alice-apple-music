name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - run: cargo test --locked --workspace --manifest-path rust/Cargo.toml
      - run: cargo clippy --locked --workspace --manifest-path rust/Cargo.toml --all-targets -- -D warnings
  luna-package:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - run: cargo install cargo-zigbuild --locked --version 0.24.0
      - run: bash rust/build.sh --zig
      - run: cargo run --locked --manifest-path rust/Cargo.toml -p xtask -- package
      - uses: actions/upload-artifact@v4
        with:
          name: alice-apple-music-luna-aarch64
          path: |
            dist/*.yap
            dist/*.yap.sha256
